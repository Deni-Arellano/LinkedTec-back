<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }
        #chat-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        #chat-header {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        #chat {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        #message {
            width: calc(100% - 100px);
        }
        #send {
            width: 80px;
        }
        .message {
            max-width: 60%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            word-wrap: break-word;
            position: relative;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #dcf8c6;
        }
        .message.received {
            align-self: flex-start;
            background-color: #fff;
            border: 1px solid #ccc;
        }
        .timestamp {
            font-size: 0.8em;
            color: #888;
            text-align: right;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <button onclick="window.location.href='datos_usarios.html'">Regresar</button>
    <div id="chat-container">
        <div id="chat-header"></div>
        <div id="chat"></div>
        <input type="text" id="message" placeholder="Escribe un mensaje...">
        <button id="send">Enviar</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let currentChatId = null;
            let userId = 1; // Establecer el ID del usuario directamente
            let socket;

            // Obtener parámetros de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('chatId');
            const chatName = urlParams.get('chatName');

            if (chatId && chatName) {
                openChat(chatId, chatName);
            }

            function openChat(chatId, chatName) {
                currentChatId = chatId;
                console.log(`Chat ${chatId} seleccionado. Usuario ID: ${userId}`);
                document.getElementById('chat-header').textContent = `Estás en ${chatName}`;
                document.getElementById('chat').innerHTML = ''; // Limpiar el chat actual
                document.getElementById('chat-container').style.display = 'flex'; // Mostrar el contenedor del chat

                // Cerrar la conexión WebSocket anterior si existe
                if (socket) {
                    socket.close();
                }

                // Crear una nueva conexión WebSocket con el userId en la URL
                socket = new WebSocket(`ws://localhost:8080/chat/${chatId}?userId=${userId}`);

                socket.addEventListener('open', function (event) {
                    console.log('Conectado al servidor WebSocket');
                });

                socket.addEventListener('message', function (event) {
                    const data = JSON.parse(event.data);
                    if (data.messages) {
                        data.messages.forEach(msg => {
                            displayMessage(msg.mensaje, msg.id_remitente === userId ? 'sent' : 'received', new Date(msg.fecha_envio));
                        });
                    } else {
                        displayMessage(data.message, data.from === 'server' ? 'received' : 'sent', new Date());
                    }
                });

                socket.addEventListener('close', function (event) {
                    console.log('Desconectado del servidor WebSocket');
                });
            }

            document.getElementById('send').addEventListener('click', function () {
                const input = document.getElementById('message');
                const message = input.value;
                if (message && currentChatId !== null) {
                    console.log(`Enviando mensaje desde el usuario ${userId} en el chat ${currentChatId}`);
                    const timestamp = new Date();
                    socket.send(JSON.stringify({ clientId: userId, chatId: currentChatId, message }));

                    displayMessage(message, 'sent', timestamp);
                    input.value = '';
                }
            });

            function displayMessage(message, type, timestamp) {
                const chat = document.getElementById('chat');
                const messageElement = document.createElement('div');
                messageElement.textContent = message;
                messageElement.classList.add('message', type);

                const timestampElement = document.createElement('div');
                timestampElement.textContent = timestamp.toLocaleString();
                timestampElement.classList.add('timestamp');

                messageElement.appendChild(timestampElement);
                chat.appendChild(messageElement);
                chat.scrollTop = chat.scrollHeight;
            }

            // Cerrar la conexión WebSocket cuando se navega fuera de la página
            window.addEventListener('beforeunload', function() {
                if (socket) {
                    socket.close();
                }
            });
        });
    </script>
</body>
</html>
