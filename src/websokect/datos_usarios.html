<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chats Dinámicos</title>
    <style>
        .chat-card {
            border: 1px solid #ccc;
            padding: 16px;
            margin: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Mis Chats</h1>
    <div>
        <label for="idUsuario">ID de Usuario:</label>
        <input type="number" id="idUsuario" placeholder="Ingrese su ID">
        <button id="conectarBtn">Conectar</button>
    </div>
    <p id="estadoConexion">No conectado.</p>
    <div id="chats-container"></div>

    <script>
        let socket;

        document.getElementById('conectarBtn').addEventListener('click', () => {
            const idUsuario = document.getElementById('idUsuario').value;
            if (!idUsuario) {
                alert('Por favor, ingrese un ID de usuario.');
                return;
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }

            socket = new WebSocket('ws://localhost:8083');

            socket.addEventListener('open', () => {
                console.log('Conectado al servidor WebSocket');
                document.getElementById('estadoConexion').textContent = `Conectado como ID Usuario: ${idUsuario}`;
                socket.send(JSON.stringify({ tipo: 'obtenerDatosChat', idUsuario: parseInt(idUsuario) }));
            });

            socket.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.tipo === 'datosChat') {
                        renderChats(data.datos);
                    } else if (data.tipo === 'error') {
                        console.error('Error del servidor:', data.mensaje);
                    }
                } catch (error) {
                    console.error('Error al procesar la respuesta:', error);
                }
            });

            socket.addEventListener('error', (error) => {
                console.error('Error en la conexión WebSocket:', error);
            });

            socket.addEventListener('close', () => {
                console.log('Desconectado del servidor WebSocket');
                document.getElementById('estadoConexion').textContent = 'Desconectado.';
            });
        });

        function renderChats(datosChat) {
            const contenedor = document.getElementById('chats-container');
            contenedor.innerHTML = ''; // Limpiar contenido previo

            if (!Array.isArray(datosChat)) {
                console.error('Datos del chat no son un array:', datosChat);
                return;
            }

            datosChat.forEach(chat => {
                const carta = document.createElement('div');
                carta.className = 'chat-card';
                carta.innerHTML = `
                    <h2>${chat.usuario.nombre}</h2>
                    <p>${chat.ultimoMensaje ? chat.ultimoMensaje.texto : 'No hay mensajes'}</p>
                    <small>${chat.ultimoMensaje ? new Date(chat.ultimoMensaje.fecha).toLocaleString() : ''}</small>
                `;
                contenedor.appendChild(carta);
            });
        }
    </script>
</body>
</html>
