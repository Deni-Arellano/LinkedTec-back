<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Chats</title>
    <style>
        .chat-card {
            border: 1px solid #ccc;
            padding: 16px;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
        }
        .chat-card img {
            border-radius: 50%;
            margin-right: 16px;
            width: 50px;
            height: 50px;
        }
    </style>
</head>
<body>
    <h1>Mis Chats</h1>
    <div>
        <label for="idUsuario">ID de Usuario:</label>
        <input type="number" id="idUsuario" placeholder="Ingrese su ID">
        <button id="conectarBtn">Conectar</button>
    </div>
    <p id="estadoConexion">No conectado.</p>
    <div id="chats-container"></div>

    <script>
        document.getElementById('conectarBtn').addEventListener('click', () => {
            const idUsuario = document.getElementById('idUsuario').value;
            if (!idUsuario) {
                alert('Por favor, ingrese su ID de usuario.');
                return;
            }

            const socket = new WebSocket(`ws://localhost:8083/?idUsuario=${idUsuario}`);

            socket.addEventListener('open', (event) => {
                console.log('Conectado al servidor WebSocket');
                document.getElementById('estadoConexion').textContent = 'Conectado.';

                // Solicitar datos de chat iniciales
                socket.send(JSON.stringify({ tipo: 'obtenerDatosChat', idUsuario }));
            });

            socket.addEventListener('message', (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.tipo === 'datosChat' || data.tipo === 'datosChatActualizados') {
                        renderChats(data.datos);
                    } else if (data.tipo === 'nuevoMensaje' || data.tipo === 'mensajeEnviado') {
                        actualizarChat(data.mensaje);
                    } else if (data.tipo === 'error') {
                        console.error('Error del servidor:', data.mensaje);
                    }
                } catch (error) {
                    console.error('Error al procesar la respuesta:', error);
                }
            });

            socket.addEventListener('error', (error) => {
                console.error('Error en la conexión WebSocket:', error);
            });

            socket.addEventListener('close', () => {
                console.log('Desconectado del servidor WebSocket');
                document.getElementById('estadoConexion').textContent = 'Desconectado.';
            });

            function renderChats(datosChat) {
                const contenedor = document.getElementById('chats-container');
                contenedor.innerHTML = ''; // Limpiar contenido previo

                if (!Array.isArray(datosChat)) {
                    console.error('Datos del chat no son un array:', datosChat);
                    return;
                }

                const usuariosProcesados = new Set();

                datosChat.forEach(chat => {
                    if (!chat.usuario || !chat.usuario.id || !chat.usuario.nombre) {
                        console.error('Datos del chat incompletos:', chat);
                        return;
                    }

                    const usuario = chat.usuario;
                    if (!usuariosProcesados.has(usuario.id)) {
                        const carta = document.createElement('div');
                        carta.className = 'chat-card';
                        carta.innerHTML = `
                            <img src="${usuario.imagen_usuario}" alt="Imagen de ${usuario.nombre}">
                            <div>
                                <p>${usuario.nombre}</p>
                                <p>${chat.mensaje}</p>
                                <p>${new Date(chat.fecha_envio).toLocaleString()}</p>
                            </div>
                        `;
                        contenedor.appendChild(carta);
                        usuariosProcesados.add(usuario.id);
                    }
                });
            }

            function actualizarChat(mensaje) {
                const contenedor = document.getElementById('chats-container');
                const chatCards = contenedor.getElementsByClassName('chat-card');

                for (let card of chatCards) {
                    if (card.querySelector('p').textContent === mensaje.id_remitente) {
                        card.querySelector('p:nth-child(2)').textContent = mensaje.mensaje;
                        card.querySelector('p:nth-child(3)').textContent = new Date(mensaje.fecha_envio).toLocaleString();
                        return;
                    }
                }

                // Si no se encuentra la tarjeta, agregar una nueva
                const carta = document.createElement('div');
                carta.className = 'chat-card';
                carta.innerHTML = `
                    <img src="${mensaje.imagen_usuario}" alt="Imagen de ${mensaje.id_remitente}">
                    <div>
                        <p>${mensaje.id_remitente}</p>
                        <p>${mensaje.mensaje}</p>
                        <p>${new Date(mensaje.fecha_envio).toLocaleString()}</p>
                    </div>
                `;
                contenedor.appendChild(carta);
            }
        });
    </script>
</body>
</html>
