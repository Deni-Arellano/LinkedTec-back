<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cliente 1 - Chat WebSocket</title>
    <style>
        #chat-container {
            width: 300px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        #messages {
            height: 200px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 5px;
        }
        .message.sent { text-align: right; color: blue; }
        .message.received { text-align: left; color: green; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h3>Cliente 1</h3>
        <div id="messages"></div>
        <input type="text" id="message" placeholder="Escribe un mensaje...">
        <button id="send">Enviar</button>
    </div>

    <script>
        const socket = new WebSocket('ws://localhost:8080');
        let currentRecipientId = 2; // ID del destinatario predeterminado

        socket.onopen = function() {
            console.log('Conexión WebSocket establecida.');
        };

        socket.onmessage = function(event) {
            try {
                const message = JSON.parse(event.data);
                console.log(`Soy cliente 1, llegó este mensaje de Cliente ${message.senderId}: ${message.content}`);
                displayMessage(message.senderId, message.content, 'received');
            } catch (error) {
                console.error('Error al procesar el mensaje:', error);
            }
        };

        document.getElementById('send').onclick = function() {
            const messageInput = document.getElementById('message');
            const message = messageInput.value;

            if (message) {
                const payload = JSON.stringify({
                    senderId: 1, // ID de Cliente 1
                    recipientId: currentRecipientId, // ID del destinatario
                    content: message
                });
                socket.send(payload);
                displayMessage(1, message, 'sent');
                messageInput.value = '';
            }
        };

        function displayMessage(senderId, content, type) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.textContent = `${senderId === 1 ? 'Tú' : 'Usuario ' + senderId}: ${content}`;
            document.getElementById('messages').appendChild(messageElement);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
