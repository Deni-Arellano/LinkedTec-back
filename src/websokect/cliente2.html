<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente 2</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #messages { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; }
        #input { width: calc(100% - 22px); }
    </style>
</head>
<body>
    <h1>Cliente 2 (ID: 2)</h1>
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Escribe un mensaje...">
    <button id="send">Enviar</button>

    <script>
        const clientId = 2; // ID único para este cliente
        const ws = new WebSocket('ws://localhost:8080');

        ws.onopen = () => {
            console.log('Conectado al servidor WebSocket');
        };

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += `<p><strong>Cliente ${message.sender}:</strong> ${message.content}</p>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        ws.onerror = (error) => {
            console.error('Error en la conexión WebSocket:', error);
        };

        document.getElementById('send').onclick = () => {
            const input = document.getElementById('input');
            if (input.value.trim() === '') {
                alert('Por favor, escribe un mensaje antes de enviar.');
                return;
            }
            const message = { 
                type: 'message', 
                content: input.value, 
                sender: clientId, 
                recipient: 1 
            };
            ws.send(JSON.stringify(message));
            input.value = ''; 
        };
    </script>
</body>
</html>
