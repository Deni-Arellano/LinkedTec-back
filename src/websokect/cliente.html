<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Notificaciones</title>
</head>
<body>
    <h1>Simulador de Notificaciones</h1>

    <!-- Campo para ingresar el ID del usuario -->
    <label for="userId">ID del Usuario:</label>
    <input type="number" id="userId" placeholder="Ingresa tu ID" required>
    <button id="connectBtn">Conectar</button>

    <!-- Campo para mostrar las notificaciones -->
    <h2>Notificaciones Recibidas:</h2>
    <div id="notifications"></div>

    <script>
        let socket;

        document.getElementById('connectBtn').addEventListener('click', function () {
            const userId = document.getElementById('userId').value;

            if (!userId) {
                alert('Por favor ingresa un ID de usuario.');
                return;
            }

            // Conectar al servidor WebSocket
            socket = new WebSocket('ws://localhost:8081'); // Cambia el puerto si es necesario

            socket.onopen = function () {
                console.log('Conectado al servidor WebSocket.');
                socket.send(JSON.stringify({ tipo: 'suscripcion', id_usuario: userId }));
            };

            socket.onmessage = function (event) {
                const message = JSON.parse(event.data);

                if (message.error) {
                    alert(`Error: ${message.error}`);
                    return;
                }

                if (message.notificacion) {
                    const notificationsDiv = document.getElementById('notifications');
                    const newNotification = document.createElement('p');
                    newNotification.textContent = message.notificacion.mensaje;
                    notificationsDiv.appendChild(newNotification);
                }
            };

            socket.onerror = function (error) {
                console.error('Error en WebSocket:', error);
            };

            socket.onclose = function () {
                console.log('Conexión cerrada.');
            };
        });
    </script>
</body>
</html>
