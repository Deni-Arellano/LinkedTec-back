<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Notificaciones</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #notificaciones { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; }
        #userIdInput { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Notificaciones (ID Usuario)</h1>
    <input type="number" id="userIdInput" placeholder="Ingrese su ID de usuario (Egresado/Estudiante)" />
    <button id="connect">Conectar</button>
    <div id="notificaciones"></div>

    <script>
        let userId;
        let ws;

        document.getElementById('connect').onclick = () => {
            userId = document.getElementById('userIdInput').value;
            if (!userId) {
                alert('Por favor, ingrese un ID de usuario.');
                return;
            }
            connectWebSocket();
        };

        function connectWebSocket() {
            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                console.log(`Conectado al servidor WebSocket como usuario ID: ${userId}`);
            };

            ws.onmessage = (event) => {
                console.log('Mensaje recibido del servidor:', event.data); // Log del mensaje recibido
                const mensaje = JSON.parse(event.data);
                console.log('Notificación recibida:', mensaje);

                // Verifica si la notificación es del tipo 'empleo' y para este usuario
                if (mensaje.tipo === 'empleo' && mensaje.id_usuario_destinatario == userId) {
                    mostrarNotificacion(mensaje.mensaje);
                } else {
                    console.log(`No es para el usuario ID: ${userId} o no es del tipo 'empleo'`);
                }
            };

            ws.onclose = () => {
                console.log('Conexión cerrada');
            };

            ws.onerror = (error) => {
                console.error('Error en la conexión WebSocket:', error);
            };
        }


        function mostrarNotificacion(mensaje) {
            const notificacionesDiv = document.getElementById('notificaciones');
            const notificacionElemento = document.createElement('p');
            notificacionElemento.textContent = `Notificación: ${mensaje}`;
            notificacionesDiv.appendChild(notificacionElemento);
        }
    </script>
</body>
</html>
